services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tiffino
      POSTGRES_USER: tiffino
      POSTGRES_PASSWORD: tiffino
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiffino -d tiffino"]
      interval: 2s
      timeout: 3s
      retries: 20
