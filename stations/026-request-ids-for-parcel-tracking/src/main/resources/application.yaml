spring:
  application:
    name: dakroute-tracking
  mvc:
    problemdetails:
      enabled: true

# Every log line carries the request id from the MDC, or "-" outside a request.
logging:
  pattern:
    level: "%5p [rid:%X{requestId:--}]"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

dakroute:
  tracking:
    simulate-outage: false   # true only for a failure drill
