spring:
  application:
    name: basketo-referrals
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/basketo
    username: basketo
    password: basketo

basketo:
  referrals:
    # Demo rules: ₹100 to the referrer once the new customer's first order of at least ₹500 is delivered.
    reward-paise: 10000
    minimum-order-paise: 50000
  wallet:
    # The wallet service (simulated: docs/test-wallet.py in the captures).
    url: http://localhost:9095
    timeout: 3s
    # A credit is tried 5 times, 1 s, 2 s, 4 s, 8 s apart; then it is parked as DEAD for a person.
    max-attempts: 5
    first-retry-after: 1s
    poll-every: 1s
