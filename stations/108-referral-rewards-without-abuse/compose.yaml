services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: basketo
      POSTGRES_USER: basketo
      POSTGRES_PASSWORD: basketo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basketo -d basketo"]
      interval: 2s
      timeout: 3s
      retries: 20
