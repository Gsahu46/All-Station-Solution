services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]   # a one-node replica set: MongoDB only allows multi-document transactions on one
    ports:
      - "27017:27017"
    healthcheck:
      # Starts the replica set on the first check, then reports healthy once this node is its primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; db.hello().isWritablePrimary || quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 30
