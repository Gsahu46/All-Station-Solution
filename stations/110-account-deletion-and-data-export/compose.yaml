services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chaupal
      POSTGRES_USER: chaupal
      POSTGRES_PASSWORD: chaupal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaupal -d chaupal"]
      interval: 2s
      timeout: 3s
      retries: 20
