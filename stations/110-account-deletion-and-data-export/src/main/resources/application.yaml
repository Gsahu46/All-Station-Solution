spring:
  application:
    name: chaupal-accounts
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/chaupal
    username: chaupal
    password: chaupal

chaupal:
  jobs:
    # Exports and erasures are picked up every 5 s (demo rule); sign-in records older than 180 days go nightly at 03:10.
    every: 5s
    purge-cron: "0 10 3 * * *"
