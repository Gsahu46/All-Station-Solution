spring:
  application:
    name: kartwala-export
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/kartwala
    username: kartwala
    password: kartwala
  jdbc:
    template:
      # Rows come from PostgreSQL 1,000 at a time (a cursor, inside a transaction), not all at once.
      fetch-size: 1000
