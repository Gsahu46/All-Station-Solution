services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dakroute
      POSTGRES_USER: dakroute
      POSTGRES_PASSWORD: dakroute
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dakroute -d dakroute"]
      interval: 2s
      timeout: 3s
      retries: 20
