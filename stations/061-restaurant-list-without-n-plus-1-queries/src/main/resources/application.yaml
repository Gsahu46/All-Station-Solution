spring:
  application:
    name: tiffino-restaurants
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tiffino
    username: tiffino
    password: tiffino
  jpa:
    # Lazy associations load inside the service only; a view never triggers a query.
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the entities match it
