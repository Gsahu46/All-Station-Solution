spring:
  application:
    name: billora-invoices
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false

# GST rates by 4-digit HSN heading. Demo configuration modelled on how Indian GST rates are structured, including
# value slabs for apparel and the rate changes of 22 Sep 2025. Not a tax reference and not tax advice: check the
# current CBIC rate notifications before using any of these numbers. A rate change is a new dated set, added ahead
# of time; invoices dated before it keep the old rates.
billora:
  seller-state: KARNATAKA       # Billora's GSTIN is registered in Karnataka (code 29)
  hsn-rates:
    "6109":                     # T-shirts: taxed by the price of one piece
      - from: 2017-07-01
        slabs:
          - { from-paise: 0, percent: 5 }
          - { from-paise: 100001, percent: 12 }   # above Rs 1,000 a piece
      - from: 2025-09-22
        slabs:
          - { from-paise: 0, percent: 5 }
          - { from-paise: 250001, percent: 18 }   # above Rs 2,500 a piece
    "8415":                     # air conditioners
      - from: 2017-07-01
        slabs: [ { from-paise: 0, percent: 28 } ]
      - from: 2025-09-22
        slabs: [ { from-paise: 0, percent: 18 } ]
    "8471":                     # computers, keyboards, mice
      - from: 2017-07-01
        slabs: [ { from-paise: 0, percent: 18 } ]
    "8544":                     # cables
      - from: 2017-07-01
        slabs: [ { from-paise: 0, percent: 18 } ]
