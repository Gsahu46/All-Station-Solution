spring:
  application:
    name: kartwala-refunds
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
# Every log line carries the request id from the MDC, or "-" outside a request.
logging:
  pattern:
    level: "%5p [rid:%X{requestId:--}]"
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
kartwala:
  refunds:
    simulate-ledger-failure: false   # true only for a failure drill
