spring:
  application:
    name: teamdesk-holidays
  mvc:
    problemdetails:
      enabled: true

teamdesk:
  holidays:
    # The simulated provider in this same app. A real deployment points this at the provider's URL.
    base-url: http://localhost:${server.port:8080}/demo-provider
    connect-timeout: 1s
    read-timeout: 2s     # longer than the provider's normal answer, far shorter than our clients will wait
  demo-provider:
    enabled: true
