services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: basketo
      MYSQL_USER: basketo
      MYSQL_PASSWORD: basketo
      MYSQL_ROOT_PASSWORD: basketo-root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ubasketo -pbasketo --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
