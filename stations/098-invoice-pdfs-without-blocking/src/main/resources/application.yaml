spring:
  application:
    name: billora-invoices
  mvc:
    problemdetails:
      enabled: true

billora:
  pdf:
    # Demo rules: two renders at a time, twenty waiting; anything more is refused with 503 instead of waiting for ever.
    workers: 2
    queue: 20
    # Simulated rendering speed: 300 pages take about 40 s.
    ms-per-page: 130
