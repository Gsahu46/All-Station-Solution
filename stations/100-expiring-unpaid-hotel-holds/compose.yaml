services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ghoomo
      POSTGRES_USER: ghoomo
      POSTGRES_PASSWORD: ghoomo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghoomo -d ghoomo"]
      interval: 2s
      timeout: 3s
      retries: 20
