spring:
  application:
    name: ghoomo-holds
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ghoomo
    username: ghoomo
    password: ghoomo

ghoomo:
  holds:
    # Demo rules: a room is held for 15 minutes while the guest pays; the job looks for expired holds every 30 s.
    ttl: 15m
    expiry:
      enabled: true
      every: 30s
