spring:
  application:
    name: tijori-kyc
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Demo rule: a KYC document is at most 5 MB. Tomcat refuses bigger parts before our code runs (413).
      max-file-size: 5MB
      max-request-size: 6MB
      # Parts above this are written to a temporary file while they arrive, not kept in memory.
      file-size-threshold: 64KB
tijori:
  storage-dir: ${java.io.tmpdir}/tijori-kyc
