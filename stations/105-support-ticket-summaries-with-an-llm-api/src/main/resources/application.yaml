spring:
  application:
    name: taskloom-support
  mvc:
    problemdetails:
      enabled: true

taskloom:
  model:
    # A model provider with Anthropic's Messages API. Simulated in this station (docs/test-model.py, port 9077): no key
    # is available here, so no real model was called. For a real one: https://api.anthropic.com/v1/messages, your key in
    # TASKLOOM_MODEL_API_KEY and the provider's model id in TASKLOOM_MODEL_NAME.
    url: ${TASKLOOM_MODEL_URL:http://localhost:9077/v1/messages}
    api-key: ${TASKLOOM_MODEL_API_KEY:demo-key-not-a-real-one}
    name: ${TASKLOOM_MODEL_NAME:demo-model}
    # Demo rules: a summary is at most 400 tokens; the thread sent at most 12,000 characters (roughly 3,000 tokens).
    max-output-tokens: 400
    max-input-chars: 12000
    connect-timeout: 2s
    timeout: 20s
  budget:
    # Demo rule: 200,000 tokens a team a day (roughly 60 summaries of long threads).
    tokens-per-team-per-day: 200000
