services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paysetu
      POSTGRES_USER: paysetu
      POSTGRES_PASSWORD: paysetu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysetu -d paysetu"]
      interval: 2s
      timeout: 3s
      retries: 20
