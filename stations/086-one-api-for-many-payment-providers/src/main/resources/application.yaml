spring:
  application:
    name: paysetu-payments
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/paysetu
    username: paysetu
    password: paysetu
  jackson:
    deserialization:
      accept-float-as-int: false
paysetu:
  # Which adapter takes payments, and which one is tried when the first was never reached. Names: sim-alpha, sim-beta.
  primary: sim-alpha
  fallback: sim-beta
