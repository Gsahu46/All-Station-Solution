services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tijori
      POSTGRES_USER: tijori
      POSTGRES_PASSWORD: tijori
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tijori -d tijori"]
      interval: 2s
      timeout: 3s
      retries: 20
