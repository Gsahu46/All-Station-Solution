services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672, guest / guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 30
  # The partner bank's SFTP server (simulated): user "koshbank", password "demo-only", files in /upload.
  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "2222:22"
    command: koshbank:demo-only:1001::upload
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 2s
      timeout: 3s
      retries: 30
