spring:
  application:
    name: bimaly-partner-files
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # A file's run is DONE only after the broker confirms it has every message.
    publisher-confirm-type: simple

camel:
  main:
    # Let the route finish the file it is on when the app stops (Camel's default is 45 s).
    shutdown-timeout: 30

bimaly:
  partner:
    # KoshBank's SFTP folder (simulated: compose.yaml). Poll every 30 s. Demo rules: a password, and the server's key
    # not checked. Production uses a private key (privateKeyFile=...) and pins the bank's host key (knownHostsFile=...).
    uri: sftp://koshbank@localhost:2222/upload?password=RAW(demo-only)&strictHostKeyChecking=no&delay=30000
  files:
    # Runs, the two "already seen" records and the dead-letter folder.
    data: data
    # Demo rules: a failed step is tried 3 more times, 2 s apart; then the run fails and the next poll tries the file again.
    redeliveries: 3
    redelivery-delay: 2s
