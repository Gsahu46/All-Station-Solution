spring:
  application:
    name: mapwise-edge
  mvc:
    problemdetails:
      enabled: true

server:
  # Tomcat reads X-Forwarded-For, -Proto, -Host and -Port (the default names), but only from the load balancer.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Demo rule: the load balancer lives in 10.0.0.0/24. Spring Boot's default list trusts every private and
      # loopback range, so any machine inside the network could claim any client address.
      internal-proxies: 10.0.0.0/24
    # Hop 2 (load balancer to app). Waiting for the next bytes of a request: a stalled upload frees its thread.
    connection-timeout: 20s
    # Longer than the load balancer's idle timeout (60 s), so the app never closes a connection the balancer is about to reuse.
    keep-alive-timeout: 75s

mapwise:
  # Demo rule: the office's public addresses. /admin answers only to admins coming from here.
  office-network: 203.0.113.0/24
  max-upload-bytes: 10485760
