spring:
  application:
    name: seatsure-holds
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/seatsure
    username: seatsure
    password: seatsure
seatsure:
  # Demo rules: a hold lasts 10 minutes; nobody waits more than 2 seconds for a seat someone else is locking.
  hold-for: 10m
  lock-timeout: 2s
  # The simulated payment provider's answer time.
  payment-delay: 300ms
