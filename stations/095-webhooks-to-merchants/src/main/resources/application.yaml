spring:
  application:
    name: paysetu-webhooks
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/paysetu
    username: paysetu
    password: paysetu

paysetu:
  webhooks:
    # Demo rules: wait 30 s after the first failure, then twice as long each time; the 8th failure is final.
    first-retry: 30s
    # Per attempt: to connect, and to get the answer's status line.
    timeout: 5s
    dispatcher:
      enabled: true
      poll: 1s
