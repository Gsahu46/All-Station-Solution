spring:
  application:
    name: fitnest-workouts
  mvc:
    problemdetails:
      enabled: true
fitnest:
  jwt:
    issuer: https://auth.fitnest.example
    audience: fitnest-api
    lifetime: 15m
    clock-skew: 60s
    # Demo only. Every pod must share it, so a token from one pod is valid on all of them: in production it comes from
    # a secret store, is at least 256 bits, and is rotated. Overridden in tests.
    secret: ZGVtby1vbmx5LWZpdG5lc3Qtand0LXNlY3JldC1rZXktMjU2LWJpdHMtb3ItbW9yZQ
