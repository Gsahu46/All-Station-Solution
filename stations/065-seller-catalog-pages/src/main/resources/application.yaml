spring:
  application:
    name: kartwala-seller-pages
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/kartwala
    username: kartwala
    password: kartwala
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the entities match it
  data:
    web:
      pageable:
        max-page-size: 100          # a bigger size is cut to 100, silently; the response says which size was used
        serialization-mode: via-dto  # {content, page: {size, number, totalElements, totalPages}}, a stable JSON shape
