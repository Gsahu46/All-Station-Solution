services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shikshalab
      POSTGRES_USER: shikshalab
      POSTGRES_PASSWORD: shikshalab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shikshalab -d shikshalab"]
      interval: 2s
      timeout: 3s
      retries: 20
