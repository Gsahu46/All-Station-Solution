spring:
  application:
    name: shikshalab-learning
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false   # 1500.50 for a paise field is a mistake to report, not a number to truncate
  datasource:
    url: jdbc:postgresql://localhost:5432/shikshalab
    username: shikshalab
    password: shikshalab
  jpa:
    # Courses are loaded inside the service, never while the response is written.
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the entities match it
