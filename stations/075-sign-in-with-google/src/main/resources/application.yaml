spring:
  application:
    name: taskloom-sign-in
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            # Demo values: not a real Google client. A real deployment registers Taskloom in Google Cloud and takes
            # these from a secret store. Spring Boot fills in Google's endpoints and its issuer, https://accounts.google.com.
            client-id: taskloom-demo.apps.googleusercontent.com
            client-secret: demo-only-not-a-real-secret
            scope: openid, email, profile
