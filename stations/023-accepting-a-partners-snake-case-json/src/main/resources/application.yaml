spring:
  application:
    name: dakroute-partner
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
      # The platform's own APIs are strict: a typo in a client's field name is a 400, not silently ignored.
      # Partner payloads opt out, class by class, with @JsonIgnoreProperties(ignoreUnknown = true).
      fail-on-unknown-properties: true
