spring:
  application:
    name: bimaly-policies
  mvc:
    problemdetails:
      enabled: true

bimaly:
  insurer:
    # The insurer's SOAP endpoint (simulated: docs/test-insurer.py in the captures).
    url: http://localhost:9088/policy
    # Demo rules: 2 s to connect, 8 s for the whole answer. The insurer's own figures: usually 1 to 3 s, at worst 6 s.
    connect-timeout: 2s
    timeout: 8s
