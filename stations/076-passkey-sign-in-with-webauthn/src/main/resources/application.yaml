spring:
  application:
    name: tijori-passkeys
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tijori
    username: tijori
    password: tijori
tijori:
  webauthn:
    # The relying party: passkeys are bound to this domain, and only this web origin may use them.
    rp-id: tijori.example
    rp-name: Tijori
    origin: https://app.tijori.example
    challenge-lifetime: 5m
  jwt:
    issuer: https://auth.tijori.example
    audience: tijori-api
    access-lifetime: 10m
    clock-skew: 30s
    # Demo only: in production from a secret store. Overridden in tests.
    secret: ZGVtby1vbmx5LXRpam9yaS1hY2Nlc3MtdG9rZW4ta2V5LTI1Ni1iaXRzLW9yLW1vcmU
