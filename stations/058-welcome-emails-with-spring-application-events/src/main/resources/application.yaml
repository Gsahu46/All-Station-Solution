spring:
  application:
    name: taskloom-welcome
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true   # @Async listeners run on virtual threads
  datasource:
    url: jdbc:postgresql://localhost:5432/taskloom
    username: taskloom
    password: taskloom
taskloom:
  mail:
    attempts: 3          # then the email goes to the dead-letter state
    backoff-ms: 200      # wait 200 ms, then 400 ms, between attempts
  crm:
    delay-ms: 0          # the simulated CRM's response time; the capture sets it to show a slow CRM
