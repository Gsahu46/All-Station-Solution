services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskloom
      POSTGRES_USER: taskloom
      POSTGRES_PASSWORD: taskloom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskloom -d taskloom"]
      interval: 2s
      timeout: 3s
      retries: 20
