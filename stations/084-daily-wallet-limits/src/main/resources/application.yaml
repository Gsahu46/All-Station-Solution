spring:
  application:
    name: tijori-wallets
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tijori
    username: tijori
    password: tijori
  jackson:
    deserialization:
      # Without this, 4000.5 in a paise field would be stored as 4000.
      accept-float-as-int: false
