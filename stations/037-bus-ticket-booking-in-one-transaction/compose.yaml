services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safarbus
      POSTGRES_USER: safarbus
      POSTGRES_PASSWORD: safarbus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safarbus -d safarbus"]
      interval: 2s
      timeout: 3s
      retries: 20
