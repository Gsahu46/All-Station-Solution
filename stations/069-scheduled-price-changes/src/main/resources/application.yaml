spring:
  application:
    name: kartwala-prices
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false   # 149.99 for a paise field is a client bug: 400
  datasource:
    url: jdbc:postgresql://localhost:5432/kartwala
    username: kartwala
    password: kartwala
shop:
  # Sellers schedule in the shop's time; it is stored as an instant, so the server's own time zone never matters.
  zone: Asia/Kolkata
