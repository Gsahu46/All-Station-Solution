spring:
  application:
    name: taskloom-crm
  mvc:
    problemdetails:
      enabled: true
  datasource:
    # Production connects as crm_app itself. Here the compose user owns the tables and runs Flyway; every request's
    # transaction switches to crm_app (SET LOCAL ROLE), so the row-level policy applies either way.
    url: jdbc:postgresql://localhost:5432/crm
    username: crm
    password: crm
