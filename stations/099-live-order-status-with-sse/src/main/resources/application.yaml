spring:
  application:
    name: tiffino-orders
  mvc:
    problemdetails:
      enabled: true

tiffino:
  sse:
    # Demo rules. A stream ends after 5 minutes; the browser reconnects by itself (after `retry`) with Last-Event-ID.
    timeout: 5m
    retry: 3s
    # A comment line to every stream: writing to a client that has gone fails, and that stream is dropped.
    heartbeat: 15s
    # Events kept per order for reconnects; older ones are replaced by a snapshot of the current status.
    history: 50
