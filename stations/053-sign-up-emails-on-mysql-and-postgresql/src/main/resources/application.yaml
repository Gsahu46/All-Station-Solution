spring:
  application:
    name: taskloom-signups
  mvc:
    problemdetails:
      enabled: true
  datasource:   # PostgreSQL by default; run with --spring.profiles.active=mysql for MySQL
    url: jdbc:postgresql://localhost:5432/taskloom
    username: taskloom
    password: taskloom
  flyway:
    # {vendor} becomes postgresql or mysql: each database gets its own schema, written for it.
    locations: classpath:db/migration/{vendor}
