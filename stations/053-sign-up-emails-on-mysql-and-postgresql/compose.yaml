services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskloom
      POSTGRES_USER: taskloom
      POSTGRES_PASSWORD: taskloom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskloom -d taskloom"]
      interval: 2s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taskloom
      MYSQL_USER: taskloom
      MYSQL_PASSWORD: taskloom
      MYSQL_ROOT_PASSWORD: taskloom-root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -utaskloom -ptaskloom --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
