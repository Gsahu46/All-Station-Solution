services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: streamo
      POSTGRES_USER: streamo
      POSTGRES_PASSWORD: streamo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamo -d streamo"]
      interval: 2s
      timeout: 3s
      retries: 20
