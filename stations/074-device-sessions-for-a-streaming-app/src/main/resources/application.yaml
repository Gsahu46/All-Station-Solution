spring:
  application:
    name: streamo-devices
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/streamo
    username: streamo
    password: streamo
streamo:
  jwt:
    issuer: https://auth.streamo.example
    audience: streamo-api
    access-lifetime: 10m
    clock-skew: 30s
    # Demo only: in production from a secret store, at least 256 bits, shared by every pod. Overridden in tests.
    secret: ZGVtby1vbmx5LXN0cmVhbW8tYWNjZXNzLXRva2VuLWtleS0yNTYtYml0cy1vci1tb3Jl
  # Demo rule: a refresh token lasts 30 days unless used; each use replaces it with a new one.
  refresh-lifetime: 30d
