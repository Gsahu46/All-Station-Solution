spring:
  application:
    name: mediqo-reports
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # The POST waits until the broker confirms it has the message, so a 202 means it is safe on the broker.
    publisher-confirm-type: simple
    listener:
      simple:
        # Spring's "auto": the message is acknowledged only after the listener returns without an exception.
        # Not RabbitMQ's autoAck ("none" here), which treats a message as done the moment it is sent to the worker.
        acknowledge-mode: auto
        # One report at a time per worker: a slow report does not leave 250 others waiting behind it.
        prefetch: 1
        concurrency: 2
        retry:
          # Demo rules: three tries, 1 s then 2 s apart; after the third, the message goes to the dead-letter queue.
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

mediqo:
  reports:
    dir: data/reports
    # Simulated rendering speed: 20 ms a page.
    ms-per-page: 20
