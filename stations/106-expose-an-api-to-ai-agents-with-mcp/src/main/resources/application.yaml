spring:
  application:
    name: taskloom-agents
  mvc:
    problemdetails:
      enabled: true
  ai:
    mcp:
      server:
        name: taskloom
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: "Taskloom tasks for the signed-in user's workspace: search_tasks reads, create_task creates."
        streamable-http:
          mcp-endpoint: /mcp

taskloom:
  agents:
    # Demo rule: 60 requests a minute per caller.
    requests-per-minute: 60
    # Browser pages allowed to call /mcp (agents outside a browser send no Origin header).
    allowed-origins: https://app.taskloom.example
