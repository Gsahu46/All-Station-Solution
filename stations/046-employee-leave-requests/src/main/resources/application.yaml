spring:
  application:
    name: teamdesk-leave
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/teamdesk
    username: teamdesk
    password: teamdesk
  jpa:
    # Entities are managed only inside a service transaction: a change made after it ends is never saved.
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the entities match it
