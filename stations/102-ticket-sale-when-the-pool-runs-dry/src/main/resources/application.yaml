spring:
  application:
    name: seatsure-sales
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/seatsure
    username: seatsure
    password: seatsure
    hikari:
      # Demo rules. Ten connections; a request that cannot get one within 2 s is told so (Hikari's default waits 30 s).
      maximum-pool-size: 10
      connection-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health, metrics

seatsure:
  payments:
    # The payment gateway (simulated; docs/test-gateway.py in the captures). Each charge may take at most 3 s.
    url: http://localhost:9099
    connect-timeout: 1s
    read-timeout: 3s
