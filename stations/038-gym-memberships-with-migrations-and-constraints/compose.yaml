services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitnest
      POSTGRES_USER: fitnest
      POSTGRES_PASSWORD: fitnest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitnest -d fitnest"]
      interval: 2s
      timeout: 3s
      retries: 20
