services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kartwala
      POSTGRES_USER: kartwala
      POSTGRES_PASSWORD: kartwala
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kartwala -d kartwala"]
      interval: 2s
      timeout: 3s
      retries: 20
