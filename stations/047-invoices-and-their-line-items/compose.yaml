services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billora
      POSTGRES_USER: billora
      POSTGRES_PASSWORD: billora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billora -d billora"]
      interval: 2s
      timeout: 3s
      retries: 20
