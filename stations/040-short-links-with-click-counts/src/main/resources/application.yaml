spring:
  application:
    name: chhotu-links
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:postgresql://localhost:5432/chhotu
    username: chhotu
    password: chhotu
chhotu:
  base-url: http://localhost:8080   # what short links start with; a real deployment uses its own short domain
  clicks:
    flush-ms: 5000                  # how often buffered clicks are written to the database
