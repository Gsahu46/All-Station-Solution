services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chhotu
      POSTGRES_USER: chhotu
      POSTGRES_PASSWORD: chhotu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chhotu -d chhotu"]
      interval: 2s
      timeout: 3s
      retries: 20
