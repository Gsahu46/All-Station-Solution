spring:
  application:
    name: kartwala-prices
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # By default Jackson turns 5499.99 into the long 5499 without a word: paise must arrive as whole numbers.
      accept-float-as-int: false
  datasource:
    url: jdbc:postgresql://localhost:5432/kartwala
    username: kartwala
    password: kartwala
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, history tables included; Hibernate only checks they match
