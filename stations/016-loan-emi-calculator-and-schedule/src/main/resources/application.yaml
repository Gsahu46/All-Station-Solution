spring:
  application:
    name: tijori-loans
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false

# Interest rates by product, each valid from a date until the next one starts. Demo numbers for this learning
# station, not Tijori's (or any bank's) real rates, and not financial advice. A rate change is a new line with a
# future date, added ahead of time; old quotes keep the rate that was valid on their quote date.
tijori:
  rates:
    PERSONAL:
      - from: 2026-04-01
        annual-percent: 13.50
      - from: 2026-10-01
        annual-percent: 12.99
    HOME:
      - from: 2026-04-01
        annual-percent: 8.50
    GOLD:
      - from: 2027-01-01   # launches next year: quotes before then get 422
        annual-percent: 9.25
