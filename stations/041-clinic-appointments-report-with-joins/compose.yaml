services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mediqo
      POSTGRES_USER: mediqo
      POSTGRES_PASSWORD: mediqo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediqo -d mediqo"]
      interval: 2s
      timeout: 3s
      retries: 20
