spring:
  application:
    name: kartwala-catalog
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false   # 1500.50 for a paise field is a mistake to report, not a number to truncate
  datasource:
    url: jdbc:postgresql://localhost:5432/kartwala
    username: kartwala
    password: kartwala
  jpa:
    # Entities are read and changed inside the service only.
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the entities match it
