spring:
  application:
    name: mediqo-reminders
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    # Without this, a language we have no bundle for falls back to the SERVER's locale first: a server set to
    # Hindi would send Hindi to a Tamil speaker. With it, the fallback is always messages.properties (English).
    fallback-to-system-locale: false
