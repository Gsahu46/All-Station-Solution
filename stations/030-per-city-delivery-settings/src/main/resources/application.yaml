spring:
  application:
    name: basketo-delivery
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # A client that still sends "distanceKm" gets a 400, not a silently ignored field it thinks we used.
      fail-on-unknown-properties: true
      accept-float-as-int: false

# Demo values, not Basketo's real terms. Checked at startup by DeliverySettings: a typo stops the app.
# Override one value per environment with an environment variable, for example
#   BASKETO_CITIES_PUNE_FEEPAISE=3000
basketo:
  cities:
    bengaluru:
      radius-km: 7.0
      fee-paise: 3000
      minimum-order-paise: 19900
      store: { lat: 12.9756, lon: 77.6050 }
    pune:
      radius-km: 6.0
      fee-paise: 2500
      minimum-order-paise: 14900
      store: { lat: 18.5308, lon: 73.8475 }
    mumbai:
      radius-km: 5.0
      fee-paise: 3500
      minimum-order-paise: 24900
      store: { lat: 19.0596, lon: 72.8295 }
