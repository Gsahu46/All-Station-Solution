<title>%%TITLE%%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; station header, page blueprint, sticky tab bar, one panel at a time.
   Code always sits on a dark slate, like a terminal, in both themes. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #15212c;
  --muted: #586a7a;
  --line: #d9e1e8;
  --accent: #0a7a63;
  --accent-soft: #e0f2ec;
  --warn: #9a5200;
  --warn-soft: #fbefdc;
  --bad: #b42318;
  --bad-soft: #fde7e4;
  --ok: #146c38;
  --ok-soft: #e1f3e7;
  --code-bg: #101b25;
  --code-fg: #d7e2ea;
  --code-dim: #7f93a3;
  --code-key: #7fd1b9;
  --code-str: #f2c879;
  --code-type: #9cc4ff;
  --code-num: #f59e8b;
  --font-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131a; --surface: #121c25; --ink: #e2eaf0; --muted: #93a5b4; --line: #243341;
    --accent: #45c9a6; --accent-soft: #11322b; --warn: #f0a650; --warn-soft: #36270f;
    --bad: #ff8577; --bad-soft: #3b1815; --ok: #5bd394; --ok-soft: #12301f;
    --code-bg: #0a1117; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131a; --surface: #121c25; --ink: #e2eaf0; --muted: #93a5b4; --line: #243341;
  --accent: #45c9a6; --accent-soft: #11322b; --warn: #f0a650; --warn-soft: #36270f;
  --bad: #ff8577; --bad-soft: #3b1815; --ok: #5bd394; --ok-soft: #12301f;
  --code-bg: #0a1117; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--font-body); padding-inline: 16px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h2 { font-size: 1.4rem; font-weight: 700; margin-top: 2.2rem; margin-bottom: .7rem; }
h3 { font-size: 1.1rem; font-weight: 700; margin-top: 1.6rem; margin-bottom: .5rem; }
p, ul, ol, dl { margin: 0 0 .9rem; }
p, li, dd { max-width: 72ch; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: .86em; background: var(--accent-soft); color: var(--ink); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.eyebrow { font: 600 .74rem/1.2 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 .4rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Station header */
.station { display: grid; gap: 14px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.station .num { font: 800 .9rem/1 var(--font-mono); color: var(--accent); letter-spacing: .04em; }
.station h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); font-weight: 800; letter-spacing: -.01em; }
.station .scenario { font-size: 1.15rem; color: var(--muted); margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.meta li { font-size: .88rem; border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 999px; }
.meta li b { font-weight: 600; color: var(--muted); margin-right: 4px; }
.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 24px; font-size: .95rem; }
.links p { margin: 0; }
.chip { display: inline-block; font-size: .82rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; }

/* Blueprint */
.blueprint { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px; }
.blueprint > summary { cursor: pointer; padding: 12px 0; font: 700 1rem var(--font-display); }
.blueprint > p { color: var(--muted); font-size: .95rem; }

/* Tabs */
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin: 26px -16px 0; padding: 0 16px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.tabs button { flex: 0 0 auto; font: 600 .95rem var(--font-body); color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 8px 10px; cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .grp { flex: 0 0 auto; align-self: center; font: 700 .68rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); padding: 0 4px 0 10px; white-space: nowrap; }
.tabs .grp:first-child { padding-left: 0; }

/* Simulation banner, retry rule, class walkthrough */
.sim { display: flex; gap: 10px; align-items: baseline; margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: .95rem; }
.sim b { color: var(--warn); white-space: nowrap; }
.rulebox { border: 1px solid var(--accent); border-radius: 10px; padding: 14px 18px; margin: 0 0 1rem; background: var(--surface); }
.rulebox .eyebrow { color: var(--accent); }
.rulebox ul { margin-bottom: .6rem; }
.rulebox p:last-child { margin-bottom: 0; font-weight: 600; }
.dwn { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0 0 .6rem; font-size: .95rem; }
.dwn dt { font: 700 .74rem/1.9 var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.dwn dd { margin: 0; }
details.check { border-color: var(--ok); margin-top: 1.2rem; }
.limit { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); font-size: .95rem; }
.limit b { color: var(--warn); }
.panel { padding-top: 22px; }
.panel > h2:first-of-type { margin-top: 1.4rem; }

.belongs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 28px; border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 14px 18px; }
.belongs .eyebrow { grid-column: 1 / -1; color: var(--accent); }
.belongs ul { margin: 0; padding-left: 1.1rem; font-size: .95rem; }
.belongs .rule { margin: 0; font-size: .95rem; }

/* Beginner layer */
.level { display: inline-block; margin: 1.6rem 0 0; font: 700 .76rem/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; }
.level.start { color: var(--ok); background: var(--ok-soft); }
.level.deep { color: var(--accent); background: var(--accent-soft); margin-top: 2.6rem; }
.level + h2 { margin-top: .9rem; }
.story { list-style: none; counter-reset: story; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.story li { counter-increment: story; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.story li::before { content: "Step " counter(story); display: block; font: 600 .74rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.story li strong { font-family: var(--font-display); font-size: 1.05rem; }
.story li p { margin: 6px 0 0; font-size: .95rem; }
.story li:last-child { border-color: var(--ok); }
.lesson { font: 700 1.1rem/1.4 var(--font-display); }
.scope li { margin-bottom: .5rem; }
.challenge { border-top: 1px solid var(--line); margin-top: 2rem; padding-top: .4rem; }
.challenge h2 { margin-top: .3rem; }

/* Content blocks */
.gwt li, .rules li, .steps li { margin-bottom: .5rem; }
.gwt b { font-family: var(--font-display); font-weight: 700; color: var(--accent); }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; color: var(--muted); }
.scroll { overflow-x: auto; margin: 0 0 1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
table.narrow { width: auto; min-width: 320px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { font: 600 .74rem var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--bg); }
tbody tr:last-child td { border-bottom: 0; }
td { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font: 600 .8rem/1.4 var(--font-mono); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }

pre { margin: 0 0 1rem; }
pre.code, pre.console, pre.tree { background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font: 400 .82rem/1.55 var(--font-mono); }
pre.code code, pre.console, pre.tree { background: none; color: inherit; padding: 0; font-size: inherit; overflow-wrap: normal; }
pre.console { color: var(--code-key); }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-meta .hljs-keyword { color: var(--code-key); }
.hljs-string, .hljs-attr + .hljs-string { color: var(--code-str); }
.hljs-title, .hljs-type, .hljs-title.class_ { color: var(--code-type); }
.hljs-number { color: var(--code-num); }
.hljs-comment, .hljs-doctag { color: var(--code-dim); font-style: italic; }
.hljs-meta, .hljs-attr, .hljs-attribute, .hljs-section, .hljs-name, .hljs-tag { color: var(--code-type); }

.example { margin-bottom: 1.4rem; }
.example h3 { margin-top: 1.2rem; }
.example > p { color: var(--muted); }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.pair > div { min-width: 0; }

.trap { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 14px 18px; margin-bottom: 1rem; }
.trap .eyebrow { color: var(--warn); }
.trap .lead { font: 700 1.15rem/1.35 var(--font-display); }
.trap p:last-child { margin-bottom: 0; }

pre.mermaid { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; font: .8rem/1.5 var(--font-mono); }

.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 22px; }
.facts dt { font: 700 1rem var(--font-display); }
.facts dd { margin: 0; }

.files { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.file-list { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); }
.file-btn { text-align: left; font: 400 .82rem var(--font-mono); color: var(--muted); background: none; border: 0; border-left: 3px solid transparent; padding: 7px 10px; cursor: pointer; border-radius: 0 6px 6px 0; overflow-wrap: anywhere; }
.file-btn:hover { color: var(--ink); background: var(--surface); }
.file-btn[aria-selected="true"] { color: var(--ink); font-weight: 600; border-left-color: var(--accent); background: var(--surface); }
.file-body { min-width: 0; }
.path { font: 400 .8rem var(--font-mono); color: var(--muted); margin-bottom: .4rem; overflow-wrap: anywhere; }
.notes ul { padding-left: 1.1rem; font-size: .95rem; }
.notes p { font-size: .95rem; }

details.qa, details.finding { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; margin-bottom: 8px; }
details.qa > summary, details.finding > summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
details.qa[open] > summary, details.finding[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.finding .sev { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; margin-right: 10px; border-radius: 50%; font: 700 .8rem var(--font-mono); color: var(--bad); background: var(--bad-soft); }
.finding .evidence { font-size: .95rem; color: var(--muted); }

@media (max-width: 720px) {
  body { font-size: 16px; }
  .pair, .files, .belongs, .story, .dwn { grid-template-columns: minmax(0, 1fr); }
  .sim { flex-direction: column; gap: 2px; }
  .file-list { position: static; flex-direction: row; flex-wrap: wrap; }
  .file-btn { border-left: 0; border-bottom: 2px solid transparent; border-radius: 6px; }
  .file-btn[aria-selected="true"] { border-bottom-color: var(--accent); }
  .facts { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .facts dd { margin-bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  %%HEADER%%

%%BLUEPRINT%%  <nav class="tabbar" aria-label="Station sections">
    <div class="tabs" role="tablist">%%TABS%%</div>
  </nav>

  <main>%%PANELS%%</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tabs [role="tab"]'));

  function show(key, focus) {
    var found = tabs.some(function (t) { return t.dataset.tab === key; });
    if (!found) key = tabs[0].dataset.tab;
    tabs.forEach(function (t) {
      var on = t.dataset.tab === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById('panel-' + t.dataset.tab).hidden = !on;
      if (on && focus) t.focus();
      if (on) { // keep the active tab visible in the strip without scrolling the page
        var strip = t.parentNode;
        if (t.offsetLeft < strip.scrollLeft || t.offsetLeft + t.offsetWidth > strip.scrollLeft + strip.clientWidth) {
          strip.scrollLeft = t.offsetLeft - 16;
        }
      }
    });
    if (location.hash.slice(1) !== key) history.replaceState(null, '', '#' + key);
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t.dataset.tab); });
    t.addEventListener('keydown', function (ev) {
      var d = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      ev.preventDefault();
      show(tabs[(i + d + tabs.length) % tabs.length].dataset.tab, true);
    });
  });

  document.addEventListener('click', function (ev) {
    var link = ev.target.closest('[data-goto]');
    if (!link) return;
    ev.preventDefault();
    show(link.dataset.goto);
    document.querySelector('.tabbar').scrollIntoView({ block: 'start' });
  });

  // File browsers inside the Code and Tests tabs
  document.querySelectorAll('.file-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var group = b.dataset.group;
      document.querySelectorAll('.file-btn[data-group="' + group + '"]').forEach(function (o) {
        var on = o === b;
        o.setAttribute('aria-selected', on ? 'true' : 'false');
        document.getElementById(o.getAttribute('aria-controls')).hidden = !on;
      });
    });
  });

  show(location.hash.slice(1) || 'problem');
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });

  if (window.hljs) {
    document.querySelectorAll('pre.code code').forEach(function (el) { window.hljs.highlightElement(el); });
  }
})();
</script>
